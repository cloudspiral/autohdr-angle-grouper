name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.lock
      - run: ruff check .
      - run: python -m pytest
      - run: python tests/container_smoke.py prepare /tmp/autohdr-native-input
      - run: python solution.py --input-dir /tmp/autohdr-native-input --output-dir /tmp/autohdr-native-output
      - run: python tests/container_smoke.py validate /tmp/autohdr-native-output/predictions.csv

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker build --platform linux/amd64
          --build-arg SOURCE_DATE_EPOCH=1786253596
          --tag autohdr-angle-grouper:ci .
      - name: Record CI-local image identity
        run: >-
          docker image inspect autohdr-angle-grouper:ci
          --format 'image_id={{.Id}} size_bytes={{.Size}} repo_digests={{json .RepoDigests}}'
      - run: python tests/container_smoke.py prepare /tmp/autohdr-smoke-input
      - run: mkdir -p /tmp/autohdr-smoke-output
      - run: >-
          docker run --rm --platform linux/amd64 --network none --read-only
          --mount type=bind,src=/tmp/autohdr-smoke-input,dst=/input/images,readonly
          --mount type=bind,src=/tmp/autohdr-smoke-output,dst=/output
          autohdr-angle-grouper:ci
      - run: python tests/container_smoke.py validate /tmp/autohdr-smoke-output/predictions.csv
